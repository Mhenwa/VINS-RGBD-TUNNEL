%YAML:1.0

#common parameters
imu_topic: "/camera/imu"
image_topic: "/camera/color/image_raw"

depth_topic: "/camera/aligned_depth_to_color/image_raw"
output_path: "/workspace/VINS-RGBD/output/vins/"
auto_save_map_on_exit: 1

#pointcloud settings
pcl_dist: 10
u_boundary: 10
d_boundary: 10
l_boundary: 40
r_boundary: 40
pcl_min_dist: 0.3
pcl_max_dist: 6
resolution: 0.02
pcl_filter_min_density: 2
dense_depth_median_kernel: 3
dense_depth_edge_filter: 1
dense_depth_edge_threshold: 0.20
dense_depth_adaptive_sampling: 1
dense_depth_near_stride: 5
dense_depth_mid_stride: 10
dense_depth_far_stride: 15
dense_depth_near_range: 2.0
dense_depth_mid_range: 4.0
dense_depth_max_points_per_keyframe: 12000
dense_depth_profile: 0

# depth-to-map residual
use_depth_to_map: 1
use_depth_to_map_pose_graph: 1
depth_map_weight: 100.0
depth_map_huber: 1.0
depth_map_min_edges: 50
depth_map_max_edges_per_frame: 800
depth_map_neighbor_count: 5
depth_map_max_neighbor_dist: 1.0
depth_map_plane_max_dist: 0.2
depth_map_min_scale: 0.1
depth_map_uncertainty_enable: 0
depth_map_uncertainty_min_weight: 0.20
depth_map_uncertainty_max_weight: 1.00
depth_map_uncertainty_range: 4.0
depth_map_uncertainty_plane_sigma: 0.05
depth_map_uncertainty_residual_sigma: 0.10
depth_map_pose_graph_target_keyframes: 5
depth_map_pose_graph_opt_interval: 10
depth_map_rebuild_each_iteration: 1
depth_cloud_sync_tol: 0.02

# lightweight structural plane constraints
use_structural_planes: 0
struct_plane_min_inliers: 120
struct_plane_distance_threshold: 0.04
struct_plane_normal_merge_deg: 10.0
struct_plane_distance_merge: 0.25
struct_plane_weight: 30.0
struct_plane_huber: 0.10
struct_plane_max_planes_per_keyframe: 3
struct_plane_enable_ground: 1
struct_plane_enable_walls: 1

# corridor loop geometric verification
loop_geom_verify: 1
loop_min_bow_score: 0.05
loop_candidate_score: 0.015
loop_enable_fundamental_check: 1
loop_fundamental_threshold_px: 2.0
loop_min_pnp_inliers: 35
loop_min_inlier_ratio: 0.30
loop_max_yaw_deg: 25.0
loop_max_translation_m: 12.0
loop_teaser_enable: 1
loop_teaser_noise_bound: 0.10
loop_teaser_min_inliers: 30
loop_teaser_max_rmse: 0.20

#camera calibration

model_type: PINHOLE
camera_name: camera
image_width: 640
image_height: 480
distortion_parameters:
   k1: 1.4865749308203452e-01
   k2: -4.6815685578576460e-01
   p1: 1.6205585303208318e-03
   p2: -8.9101576735577930e-03
projection_parameters:
   fx: 6.2097277909374247e+02
   fy: 6.2212293397677581e+02
   cx: 3.1175896455154810e+02
   cy: 2.4718077836114819e+02



# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 1   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.
                        # 2  Don't know anything about extrinsic parameters. You don't need to give R,T. We will try to calibrate it. Do some rotation movement at beginning.
#If you choose 0 or 1, you should write down the following matrix.
#Rotation from camera frame to imu frame, imu^R_cam
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 0.99957087, -0.00192891 ,-0.02922921 ,
           0.00215313  ,0.99996848 , 0.00764156  ,
           0.02921355, -0.00770122 , 0.99954353      ]
#Translation from camera frame to imu frame, imu^T_cam
extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [-0.03575085, 0.0044559 , -0.03269785]

#feature traker paprameters
max_cnt: 200           # max feature number in feature tracking
min_dist: 15            # min distance between two features
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
equalize: 0             # if image is too dark or light, trun on equalize to find enough features
fisheye: 0              # if using fisheye, trun on it. A circle mask will be loaded to remove edge noisy points
lk_forward_backward_check: 1  # reject low-light tracks that cannot be tracked back to the previous frame
lk_max_fwd_bwd_error: 1.5     # max forward-backward optical-flow reprojection error in pixels
lk_max_track_error: -1.0      # disabled by default; set positive to reject high LK photometric error

#optimization parameters
max_solver_time: 0.04  # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters       The more accurate parameters you provide, the better performance
#for handheld, wheeld
# acc_n: 0.1          # accelerometer measurement noise standard deviation. #0.2
# gyr_n: 0.01         # gyroscope measurement noise standard deviation.     #0.05
# acc_w: 0.0002         # accelerometer bias random work noise standard deviation.  #0.02
# gyr_w: 2.0e-5       # gyroscope bias random work noise standard deviation.     #4.0e-5


#first time test with full log
# acc_n: 0.02 #2.9840535876578939e-02          # accelerometer measurement noise standard deviation. #0.2
# gyr_n: 0.005 #4.8602774318549456e-03         # gyroscope measurement noise standard deviation.     #0.05
# acc_w: 0.01 #9.2450042830019173e-03        # accelerometer bias random work noise standard deviation.  #0.02
# gyr_w: 3.0e-5 #3.0172667291423203e-05       # gyroscope bias random work noise standard deviation.     #4.0e-5
# g_norm: 9.805         # gravity magnitude

# #M2DGR
# gyr_n: 2.4710787075320089e-03
# gyr_w: 1.7963145905200798e-05
# acc_n: 2.6848761610624401e-02
# acc_w: 8.5216274964016023e-04
# g_norm: 9.805       # gravity magnitude

#idc
acc_n: 1.2374091609523514e-02        # accelerometer measurement noise standard deviation. #0.2   0.04
gyr_n: 3.0032654435730201e-03       # gyroscope measurement noise standard deviation.     #0.05  0.004
acc_w: 1.9218003442176448e-04        # accelerometer bias random work noise standard deviation.  #0.002
gyr_w: 5.4692100664858005e-05 
g_norm: 9.805       # gravity magnitude

#for tracked applications
#acc_n: 0.5          # accelerometer measurement noise standard deviation. #0.2
#gyr_n: 0.01         # gyroscope measurement noise standard deviation.     #0.05
#acc_w: 0.001         # accelerometer bias random work noise standard deviation.  #0.02
#gyr_w: 2.0e-5       # gyroscope bias random work noise standard deviation.     #4.0e-5


# g_norm: 9.805       # gravity magnitude

#loop closure parameters
loop_closure: 1                    # start loop closure
fast_relocalization: 1             # useful in real-time and large project
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "/workspace/VINS-RGBD/output/pose_graph/" # save and load path

#unsynchronization parameters
estimate_td: 1                      # online estimate time offset between camera and imu
td: 0.000                           # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#rolling shutter parameters
rolling_shutter: 0                      # 0: global shutter camera, 1: rolling shutter camera
rolling_shutter_tr: 0.033               # unit: s. rolling shutter read out time per frame (from data sheet).

#visualization parameters
save_image: 1                   # save image in pose graph for visualization prupose; you can close this function by setting 0
visualize_imu_forward: 0        # output imu forward propogation to achieve low latency and high frequence results
visualize_camera_size: 0.4      # size of camera marker in RVIZ
