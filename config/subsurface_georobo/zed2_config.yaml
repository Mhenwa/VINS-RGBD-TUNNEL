%YAML:1.0

# SubSurfaceGeoRobo 02_20m_zed2.bag
# The bag contains rectified left/right ZED2 images plus ZED2 IMU, but no native depth image.
# Depth is generated online by feature_tracker/scripts/zed2_stereo_depth_node.py.

imu_topic: "/zed_node/imu/data"
image_topic: "/zed_node/left/image_rect_color"
depth_topic: "/subsurface_georobo/zed2/depth"
output_path: "/workspace/VINS-RGBD/output/subsurface_georobo/vins/"
auto_save_map_on_exit: 1

# pointcloud settings
pcl_dist: 16
u_boundary: 20
d_boundary: 20
l_boundary: 60
r_boundary: 60
pcl_min_dist: 0.4
pcl_max_dist: 12
resolution: 0.04
pcl_filter_min_density: 2
dense_depth_median_kernel: 3
dense_depth_edge_filter: 1
dense_depth_edge_threshold: 0.25
dense_depth_adaptive_sampling: 1
dense_depth_near_stride: 8
dense_depth_mid_stride: 16
dense_depth_far_stride: 24
dense_depth_near_range: 3.0
dense_depth_mid_range: 7.0
dense_depth_max_points_per_keyframe: 12000
dense_depth_profile: 0

# Depth from stereo SGBM is noisier than hardware RGB-D; keep the first run conservative.
use_depth_to_map: 0
use_depth_to_map_pose_graph: 0
depth_map_weight: 50.0
depth_map_huber: 1.0
depth_map_min_edges: 50
depth_map_max_edges_per_frame: 600
depth_map_neighbor_count: 5
depth_map_max_neighbor_dist: 1.0
depth_map_plane_max_dist: 0.25
depth_map_min_scale: 0.1
depth_map_uncertainty_enable: 0
depth_map_uncertainty_min_weight: 0.20
depth_map_uncertainty_max_weight: 1.00
depth_map_uncertainty_range: 5.0
depth_map_uncertainty_plane_sigma: 0.06
depth_map_uncertainty_residual_sigma: 0.12
depth_map_pose_graph_target_keyframes: 5
depth_map_pose_graph_opt_interval: 10
depth_map_rebuild_each_iteration: 1
depth_cloud_sync_tol: 0.03

use_structural_planes: 0
struct_plane_min_inliers: 160
struct_plane_distance_threshold: 0.06
struct_plane_normal_merge_deg: 10.0
struct_plane_distance_merge: 0.30
struct_plane_weight: 20.0
struct_plane_huber: 0.12
struct_plane_max_planes_per_keyframe: 3
struct_plane_enable_ground: 1
struct_plane_enable_walls: 1

loop_geom_verify: 1
loop_min_bow_score: 0.05
loop_candidate_score: 0.015
loop_enable_fundamental_check: 1
loop_fundamental_threshold_px: 2.0
loop_min_pnp_inliers: 35
loop_min_inlier_ratio: 0.30
loop_max_yaw_deg: 25.0
loop_max_translation_m: 12.0
loop_teaser_enable: 1
loop_teaser_noise_bound: 0.10
loop_teaser_min_inliers: 30
loop_teaser_max_rmse: 0.20

model_type: PINHOLE
camera_name: zed2_left
image_width: 1280
image_height: 720
distortion_parameters:
   k1: 0
   k2: 0
   p1: 0
   p2: 0
projection_parameters:
   fx: 537.533
   fy: 537.254
   cx: 652.077
   cy: 363.230

estimate_extrinsic: 1
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 0.0313622838, -0.9995070249,  0.0014540518,
           0.0053907972, -0.0012855955, -0.9999846432,
           0.9994935450,  0.0313696407,  0.0053478204 ]
extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [ -0.0024, -0.0238, 0.0027 ]

max_cnt: 260
min_dist: 20
freq: 7
F_threshold: 1.0
show_track: 1
equalize: 1
fisheye: 0
lk_forward_backward_check: 1
lk_max_fwd_bwd_error: 1.5
lk_max_track_error: 35.0

max_solver_time: 0.05
max_num_iterations: 8
keyframe_parallax: 10.0

acc_n: 1.2323393342096369e-02
gyr_n: 1.1463712320804714e-03
acc_w: 2.5228964288896846e-04
gyr_w: 3.9502393596747744e-06
g_norm: 9.805

loop_closure: 1
fast_relocalization: 1
load_previous_pose_graph: 0
pose_graph_save_path: "/workspace/VINS-RGBD/output/subsurface_georobo/pose_graph/"

estimate_td: 1
td: 0.000
rolling_shutter: 0
rolling_shutter_tr: 0.0

save_image: 1
visualize_imu_forward: 0
visualize_camera_size: 0.4
